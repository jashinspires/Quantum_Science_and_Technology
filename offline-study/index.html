<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Science &amp; Technology — Offline Exam Study Guide</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="data/stage-01.js"></script>
  <script defer src="data/stage-02.js"></script>
  <script defer src="data/stage-03.js"></script>
  <script defer src="data/stage-04.js"></script>
  <script defer src="data/stage-05.js"></script>
  <script defer src="data/stage-06.js"></script>
  <script defer src="data/stage-07.js"></script>
  <script defer src="data/stage-08.js"></script>
  <script defer src="data/stage-09.js"></script>
  <script defer src="data/stage-10.js"></script>
  <script defer src="data/stage-11.js"></script>
  <script defer src="data/stage-12.js"></script>
  <script defer src="data/stage-13.js"></script>
  <script defer src="data/stage-14.js"></script>
  <script defer src="data/stage-15.js"></script>
  <script defer src="data/stage-16.js"></script>
  <script defer src="data/stage-17.js"></script>
  <script defer src="data/stage-18.js"></script>
  <script defer src="data/stage-19.js"></script>
  <script defer src="data/guide.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="page-shell topbar-inner">
      <div class="topbar-left">
        <a href="#/" class="home-link" id="topbar-home" aria-label="Home">
          <span class="home-icon" aria-hidden="true">⌂</span>
          <span class="home-label">Home</span>
        </a>
        <nav class="breadcrumbs" id="topbar-breadcrumbs" aria-label="Breadcrumb"></nav>
      </div>

      <div class="topbar-right">
        <form class="topbar-search-form" id="topbar-search-form">
          <label for="topbar-search-input" class="sr-only">Search all questions</label>
          <input
            type="search"
            id="topbar-search-input"
            placeholder="Search questions..."
            autocomplete="off"
          />
        </form>

        <button type="button" id="practice-toggle-btn" class="btn btn-outline" aria-pressed="false">
          Practice
        </button>

        <button type="button" id="help-btn" class="btn btn-help" aria-label="Help" title="Help">
          ?
        </button>
      </div>
    </div>
  </header>

  <main class="page-shell main-wrap" id="app-root"></main>

  <!-- Help Modal -->
  <div class="modal-overlay" id="help-modal" role="dialog" aria-modal="true" aria-labelledby="help-modal-title" hidden>
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="help-modal-title">Quick Help — How This Study Guide Works</h2>
        <button type="button" id="close-help-btn" class="btn-icon" aria-label="Close help">✕</button>
      </div>
      <div id="help-modal-body" class="modal-body"></div>
      <div class="modal-foot">
        <div class="modal-foot-links">
          <a href="#/guide" id="modal-open-guide-link" class="btn btn-primary">Full Start Here Guide</a>
          <a href="#/sources" id="modal-open-sources-link" class="btn btn-outline">View Sources</a>
          <button type="button" id="modal-theme-btn" class="btn btn-outline">Dark theme</button>
        </div>
        <button type="button" id="modal-close-footer-btn" class="btn btn-outline">Close</button>
      </div>
    </div>
  </div>

  <!-- Diagram Lightbox Modal -->
  <div class="modal-overlay" id="lightbox-modal" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption" hidden>
    <div class="lightbox-dialog">
      <div class="lightbox-head">
        <p id="lightbox-caption"></p>
        <button type="button" id="lightbox-close-btn" class="btn btn-outline" aria-label="Close enlarged diagram">✕ Close</button>
      </div>
      <div class="lightbox-stage">
        <div class="lightbox-frame">
          <img id="lightbox-img" src="" alt="" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
